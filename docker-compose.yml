services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - '8787:8787'
    environment:
      - NODE_ENV=production
      - PORT=8787
      - PROBE_IP_RANGE=0.0.0.0/0
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - WORKER_URL=http://worker:8787
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
